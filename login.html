<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIRAPAT - Login & Register</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
        .toggle-btn { text-align: center; margin-top: 15px; color: #1a73e8; cursor: pointer; font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="loginBox">
        <h2>Login SIRAPAT</h2>
        <form id="formLogin">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="nama@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="******">
            </div>
            <button type="submit">Masuk</button>
        </form>
        <div class="toggle-btn" onclick="toggleForm()">Belum punya akun? Daftar di sini</div>
    </div>

    <div id="registerBox" class="hidden">
        <h2>Daftar Akun SIRAPAT</h2>
        <form id="formRegister">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="regNama" required placeholder="Nama Anda">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" required placeholder="nama@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" required placeholder="******">
            </div>
            <div class="form-group">
                <label>Role / Peran</label>
                <select id="regRole">
                    <option value="user">Pegawai / User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit">Daftar Sekarang</button>
        </form>
        <div class="toggle-btn" onclick="toggleForm()">Sudah punya akun? Login di sini</div>
    </div>
</div>

<script>
    function toggleForm() {
        document.getElementById('loginBox').classList.toggle('hidden');
        document.getElementById('registerBox').classList.toggle('hidden');
    }

    // HANDLER REGISTER
    document.getElementById('formRegister').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nama = document.getElementById('regNama').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPassword').value;
        const role = document.getElementById('regRole').value;

        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nama, email, password, role })
        });
        const data = await res.json();
        alert(data.message);
        if (res.ok) toggleForm();
    });

    // HANDLER LOGIN
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user)); // Simpan info user & role
            alert('Login berhasil!');
            window.location.href = '/index.html'; // Pindah ke halaman utama
        } else {
            alert(data.message);
        }
    });
</script>

</body>
</html>
